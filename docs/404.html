<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting… | Moissanite Labs</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var p = location.pathname,
          prefix = "/.github",
          i = p.indexOf(prefix);
        var rest = i !== -1 ? p.slice(i + prefix.length) : "";
        if (!rest) rest = "/";
        else if (rest.charAt(0) !== "/") rest = "/" + rest;
        var url =
          "https://siliconcordat.com" + rest + location.search + location.hash;
        var meta = document.createElement("meta");
        meta.httpEquiv = "refresh";
        meta.content = "0;url=" + url;
        document.head.appendChild(meta);
        location.replace(url);
      })();
    </script>
  </head>
  <body>
    <h1>Redirecting to siliconcordat.com</h1>
    <p>
      <a href="https://siliconcordat.com/"
        >Continue to Moissanite Labs on siliconcordat.com</a
      >
    </p>
  </body>
</html>
